```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 농구 자세 코치</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f4f6f8;
  color:#18212b;
}

header{
  background:#18212b;
  color:white;
  padding:22px 20px;
  text-align:center;
}

header h1{
  margin:0 0 7px;
  font-size:28px;
}

header p{
  margin:0;
  color:#d9e1e8;
  font-size:14px;
}

.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:0 16px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.tab{
  flex:1;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#dfe5ea;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.tab.active{
  background:#18212b;
  color:white;
}

.status{
  background:white;
  border-radius:12px;
  padding:13px 15px;
  margin-bottom:14px;
  border:1px solid #dce2e7;
  font-size:14px;
}

.status strong{
  margin-right:8px;
}

.main{
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:16px;
}

.card{
  background:white;
  border:1px solid #dce2e7;
  border-radius:16px;
  padding:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.videoBox{
  position:relative;
  background:#101820;
  border-radius:12px;
  overflow:hidden;
  aspect-ratio:16/9;
}

.videoBox video,
.videoBox canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

#liveVideo,
#canvas{
  transform:scaleX(-1);
}

#recordedVideo{
  display:none;
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  padding:25px;
  font-size:18px;
  line-height:1.6;
  z-index:5;
}

.recordingBadge{
  position:absolute;
  top:14px;
  left:14px;
  z-index:10;
  background:#d52d2d;
  color:white;
  padding:8px 13px;
  border-radius:20px;
  font-size:14px;
  font-weight:bold;
  display:none;
}

.recordingBadge.show{
  display:block;
}

.controls{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.action{
  flex:1;
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.start{
  background:#1f7a4d;
  color:white;
}

.stop{
  background:#d94a4a;
  color:white;
}

.action:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.replay{
  margin-top:12px;
}

.replay label{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#687581;
}

.replay input{
  width:100%;
}

.score{
  text-align:center;
  padding:10px 0 16px;
}

.score .num{
  font-size:56px;
  font-weight:800;
}

.score small{
  display:block;
  color:#687581;
}

.check{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:13px 12px;
  border-radius:10px;
  background:#f3f5f7;
  margin:8px 0;
}

.check span:first-child{
  font-weight:600;
}

.badge{
  font-size:13px;
  font-weight:700;
  text-align:right;
}

.ok{
  color:#167343;
}

.no{
  color:#c83c3c;
}

.wait{
  color:#737f89;
}

.tip{
  margin-top:14px;
  padding:13px;
  border-radius:10px;
  background:#eef3f8;
  line-height:1.55;
  font-size:14px;
}

.result{
  border-bottom:1px solid #e5e8eb;
  padding:12px 0;
  font-size:14px;
  line-height:1.55;
}

.result:last-child{
  border-bottom:0;
}

.result b{
  font-size:15px;
}

.resultExplain{
  margin-top:5px;
  color:#65727d;
  font-size:13px;
}

.goodText{
  color:#167343;
  font-weight:700;
}

.badText{
  color:#c83c3c;
  font-weight:700;
}

.neutralText{
  color:#5e6b76;
  font-weight:700;
}

.legend{
  margin-top:10px;
  font-size:12px;
  color:#697580;
  line-height:1.5;
}

@media(max-width:800px){

  .main{
    grid-template-columns:1fr;
  }

}

</style>
</head>


<body>

<header>

  <h1>🏀 AI 농구 자세 코치</h1>

  <p>
    농구 동작을 촬영하면 AI가 자세를 분석합니다.
  </p>

</header>


<div class="wrap">


  <!-- 모드 선택 -->

  <div class="tabs">

    <button
      class="tab active"
      id="shootTab">

      슛 자세

    </button>


    <button
      class="tab"
      id="passTab">

      패스 자세

    </button>

  </div>


  <!-- 상태 -->

  <div class="status" id="status">

    <strong>상태</strong>

    <span>
      카메라를 준비하고 있습니다...
    </span>

  </div>


  <div class="main">


    <!-- 왼쪽 -->

    <section class="card">


      <div class="videoBox">


        <!-- 실제 카메라 화면 -->

        <video
          id="liveVideo"
          autoplay
          playsinline
          muted>
        </video>


        <!-- 촬영된 영상 -->

        <video
          id="recordedVideo"
          playsinline>
        </video>


        <!-- 관절선 -->

        <canvas id="canvas"></canvas>


        <!-- 카메라 시작 전 -->

        <div
          class="placeholder"
          id="placeholder">

          카메라를 준비하고 있습니다.

        </div>


        <!-- 촬영 표시 -->

        <div
          class="recordingBadge"
          id="recordingBadge">

          🔴 촬영 중

        </div>


      </div>


      <!-- 버튼 -->

      <div class="controls">


        <button
          class="action start"
          id="startBtn">

          동작 촬영 시작

        </button
```
