<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI 농구 자세 코치</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f6f8;color:#18212b}
header{background:#18212b;color:white;padding:22px 20px;text-align:center}
header h1{margin:0 0 7px;font-size:28px}
header p{margin:0;color:#d9e1e8;font-size:14px}
.wrap{max-width:1100px;margin:20px auto;padding:0 16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;border:0;border-radius:12px;padding:14px;background:#dfe5ea;font-size:17px;font-weight:700;cursor:pointer}
.tab.active{background:#18212b;color:white}
.status{background:white;border-radius:12px;padding:13px 15px;margin-bottom:14px;border:1px solid #dce2e7;font-size:14px}
.status strong{margin-right:8px}
.main{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}
.card{background:white;border:1px solid #dce2e7;border-radius:16px;padding:16px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.videoBox{position:relative;background:#101820;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
canvas{pointer-events:none}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:white;padding:25px;font-size:18px;line-height:1.6}
.controls{display:flex;gap:8px;margin-top:12px}
.action{flex:1;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
.start{background:#1f7a4d;color:white}
.stop{background:#d94a4a;color:white}
.action:disabled{opacity:.45;cursor:not-allowed}
.replay{margin-top:12px}
.replay label{display:flex;justify-content:space-between;font-size:13px;color:#687581}
.replay input{width:100%}
.score{text-align:center;padding:10px 0 16px}
.score .num{font-size:56px;font-weight:800}
.score small{display:block;color:#687581}
.check{display:flex;align-items:center;justify-content:space-between;padding:13px 12px;border-radius:10px;background:#f3f5f7;margin:8px 0}
.badge{font-size:13px;font-weight:700}
.ok{color:#167343}
.no{color:#c83c3c}
.wait{color:#737f89}
.tip{margin-top:14px;padding:13px;border-radius:10px;background:#eef3f8;line-height:1.55;font-size:14px}
.results{margin-top:16px}
.result{border-bottom:1px solid #e5e8eb;padding:10px 0;font-size:14px}
@media(max-width:800px){
.main{grid-template-columns:1fr}
.controls{flex-wrap:wrap}
.action{min-width:30%}
}
</style>
</head>

<body>

<header>
<h1>🏀 AI 농구 자세 코치</h1>
<p>슛이나 패스 동작을 한 번 수행한 뒤 중지하면 전체 동작을 분석합니다.</p>
</header>

<div class="wrap">

<div class="tabs">
<button class="tab active" id="shootTab">슛 자세</button>
<button class="tab" id="passTab">패스 자세</button>
</div>

<div class="status" id="status">
<strong>상태</strong>
<span>카메라를 시작한 뒤 동작을 준비하세요.</span>
</div>

<div class="main">

<section class="card">

<div class="videoBox">

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div class="placeholder" id="placeholder">
카메라를 시작하면<br>
여기에 내 모습이 나타납니다.
</div>

</div>

<div class="controls">

<button class="action start" id="startBtn">
동작 촬영 시작
</button>

<button class="action stop" id="stopBtn" disabled>
중지하고 분석
</button>

</div>

<div class="replay" id="replayBox" style="display:none">

<label>
<span>촬영 영상 다시 보기</span>
<span id="timeLabel">0:00 / 0:00</span>
</label>

<input id="seek" type="range" min="0" max="1000" value="0">

</div>

<div class="tip">
📌 「동작 촬영 시작」을 누르고 슛을 한 번 수행하세요.
동작이 끝나면 「중지하고 분석」을 누르면 전체 동작을 분석합니다.
</div>

</section>


<section class="card">

<div class="score">

<small>동작 전체 점수</small>

<div class="num" id="score">
--
</div>

</div>


<div class="check">

<span>① 무릎 굽힘</span>

<span class="badge wait" id="knee">
촬영 후 분석
</span>

</div>


<div class="check">

<span>② 팔꿈치 벌어짐</span>

<span class="badge wait" id="elbow">
촬영 후 분석
</span>

</div>


<div class="check">

<span>③ 무릎·팔꿈치 함께 펴기</span>

<span class="badge wait" id="sync">
촬영 후 분석
</span>

</div>


<div class="tip" id="tip">
한 번의 동작을 촬영한 뒤 중지하면 결과가 나타납니다.
</div>


<div class="results">

<strong>분석 결과</strong>

<div id="results">
아직 분석한 동작이 없습니다.
</div>

</div>

</section>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>

<script>

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

const placeholder=document.getElementById('placeholder');
const statusEl=document.getElementById('status');

const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');

const scoreEl=document.getElementById('score');

const kneeEl=document.getElementById('knee');
const elbowEl=document.getElementById('elbow');
const syncEl=document.getElementById('sync');

const tipEl=document.getElementById('tip');
const resultsEl=document.getElementById('results');

const replayBox=document.getElementById('replayBox');
const seek=document.getElementById('seek');
const timeLabel=document.getElementById('timeLabel');

const shootTab=document.getElementById('shootTab');
const passTab=document.getElementById('passTab');

let stream=null;
let recorder=null;
let chunks=[];

let landmarker=null;
let recording=false;

let mode='shoot';

let recordedUrl=null;

let analyzingVideo=false;

let lastPose=null;


function status(msg){

statusEl.innerHTML=
'<strong>상태</strong><span>'+
msg+
'</span>';

}


function badge(el,text,cls){

el.textContent=text;
el.className='badge '+cls;

}


function angle(a,b,c){

const ab={
x:a.x-b.x,
y:a.y-b.y
};

const cb={
x:c.x-b.x,
y:c.y-b.y
};

const dot=
ab.x*cb.x+
ab.y*cb.y;

const den=
Math.hypot(ab.x,ab.y)*
Math.hypot(cb.x,cb.y);

if(!den)return 180;

return Math.acos(
Math.max(
-1,
Math.min(
1,
dot/den
)
)
)*180/Math.PI;

}


function drawPose(lm){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

const pairs=[

[11,13],
[13,15],
[12,14],
[14,16],
[11,12],
[11,23],
[12,24],
[23,25],
[25,27],
[24,26],
[26,28]

];


pairs.forEach(([a,b])=>{

if(lm[a]&&lm[b]){

ctx.beginPath();

ctx.moveTo(
lm[a].x*canvas.width,
lm[a].y*canvas.height
);

ctx.lineTo(
lm[b].x*canvas.width,
lm[b].y*canvas.height
);

ctx.strokeStyle='#00ff66';

ctx.lineWidth=4;

ctx.stroke();

}

});


[
11,12,13,14,15,16,
23,24,25,26,27,28
].forEach(i=>{

if(lm[i]){

ctx.beginPath();

ctx.arc(
lm[i].x*canvas.width,
lm[i].y*canvas.height,
6,
0,
Math.PI*2
);

ctx.fillStyle='#00ff66';

ctx.fill();

}

});

}


function initAI(){

return new Promise((resolve,reject)=>{

try{

if(typeof Pose==='undefined'){

throw Error(
'MediaPipe 모듈을 불러오지 못했습니다.'
);

}


landmarker=new Pose({

locateFile:file=>
`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`

});


landmarker.setOptions({

modelComplexity:1,

smoothLandmarks:true,

enableSegmentation:false,

minDetectionConfidence:.5,

minTrackingConfidence:.5

});


landmarker.onResults(result=>{

if(
result.poseLandmarks &&
result.poseLandmarks.length
){

lastPose=result.poseLandmarks;

if(!analyzingVideo){

drawPose(result.poseLandmarks);

}

}

});


resolve();

}

catch(e){

reject(e);

}

});

}


async function startCamera(){

try{

status(
'카메라 권한을 요청하는 중입니다...'
);


stream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:'user',
width:{ideal:1280},
height:{ideal:720}
},

audio:false

});


video.srcObject=stream;

video.muted=true;

await video.play();

placeholder.style.display='none';


canvas.width=
video.videoWidth||1280;

canvas.height=
video.videoHeight||720;


await initAI();


status(
'준비 완료. 「동작 촬영 시작」을 눌러 한 번의 슛을 촬영하세요.'
);


}

catch(e){

console.error(e);


if(stream){

stream
.getTracks()
.forEach(t=>t.stop());

stream=null;

}


if(e.name==='NotAllowedError'){

status(
'카메라 권한을 허용해 주세요.'
);

}

else{

status(
e.message||
'카메라 또는 AI 모듈 연결에 실패했습니다.'
);

}

}

}


function resetResult(){

scoreEl.textContent='--';

badge(
kneeEl,
'촬영 후 분석',
'wait'
);

badge(
elbowEl,
'촬영 후 분석',
'wait'
);

badge(
syncEl,
'촬영 후 분석',
'wait'
);

tipEl.textContent=
'한 번의 동작을 촬영한 뒤 중지하면 결과가 나타납니다.';

resultsEl.textContent=
'아직 분석한 동작이 없습니다.';

}


async function beginRecording(){

if(!stream){

await startCamera();

if(!stream)return;

}


chunks=[];

resetResult();

replayBox.style.display='none';

video.controls=false;

video.srcObject=stream;

video.muted=true;

await video.play();


let options={
mimeType:'video/webm;codecs=vp8'
};


if(
!MediaRecorder.isTypeSupported(
options.mimeType
)
){

options={
mimeType:'video/webm'
};

}


try{

recorder=
new MediaRecorder(
stream,
options
);

}

catch(e){

recorder=
new MediaRecorder(stream);

}


recorder.ondataavailable=e=>{

if(
e.data &&
e.data.size
){

chunks.push(e.data);

}

};


recorder.onstop=()=>finishRecording();


recorder.start(100);

recording=true;

startBtn.disabled=true;

stopBtn.disabled=false;

startBtn.textContent=
'촬영 중...';

status(
'촬영 중입니다. 슛 동작을 한 번 수행한 뒤 「중지하고 분석」을 눌러 주세요.'
);

}


function stopRecording(){

if(
!recorder ||
recorder.state==='inactive'
)return;


recorder.stop();

recording=false;

stopBtn.disabled=true;

startBtn.disabled=false;

startBtn.textContent=
'다시 촬영';

status(
'촬영을 저장하고 전체 동작을 분석하는 중입니다...'
);

}


async function finishRecording(){

const blob=
new Blob(
chunks,
{type:'video/webm'}
);


if(recordedUrl){

URL.revokeObjectURL(
recordedUrl
);

}


recordedUrl=
URL.createObjectURL(blob);


if(stream){

stream
.getTracks()
.forEach(t=>t.stop());

stream=null;

}


video.srcObject=null;

video.src=recordedUrl;

video.controls=false;

video.muted=false;

replayBox.style.display='block';


video.onloadedmetadata=
async()=>{

seek.max=1000;

updateTime();

await analyzeRecording();

};

}


function updateTime(){

const d=
video.duration||0;

const t=
video.currentTime||0;

timeLabel.textContent=
`${fmt(t)} / ${fmt(d)}`;

seek.value=
d?
Math.round(
t/d*1000
):
0;

}


function fmt(sec){

sec=
Math.max(
0,
Math.floor(sec)
);

return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;

}


seek.addEventListener(
'input',
()=>{

if(video.duration){

video.currentTime=
video.duration*
(Number(seek.value)/1000);

}

updateTime();

}
);


video.addEventListener(
'timeupdate',
updateTime
);


function frameMetrics(lm){

const knee=
(
angle(lm[23],lm[25],lm[27])+
angle(lm[24],lm[26],lm[28])
)/2;


const elbow=
(
angle(lm[11],lm[13],lm[15])+
angle(lm[12],lm[14],lm[16])
)/2;


return{
knee,
elbow
};

}


function seekVideo(t){

return new Promise(resolve=>{

if(!video.duration){

resolve();

return;

}


const target=
Math.min(
Math.max(0,t),
video.duration
);


const done=()=>{

video.removeEventListener(
'seeked',
done
);

resolve();

};


video.addEventListener(
'seeked',
done
);


video.currentTime=target;

});

}


async function analyzeRecording(){

if(
!landmarker ||
!video.duration
){

status(
'분석할 영상을 찾지 못했습니다.'
);

return;

}


analyzingVideo=true;


const data=[];

const oldTime=
video.currentTime;

const wasMuted=
video.muted;


video.muted=true;


const step=.12;


for(
let t=0;
t<video.duration;
t+=step
){

await seekVideo(t);


try{

await landmarker.send({
image:video
});


if(lastPose){

const m=
frameMetrics(lastPose);


if(
Number.isFinite(m.knee) &&
Number.isFinite(m.elbow)
){

data.push({
t,
knee:m.knee,
elbow:m.elbow
});

}

}

}

catch(e){

console.error(e);

}

}


await seekVideo(oldTime);

video.muted=
wasMuted;

analyzingVideo=false;


if(data.length<5){

status(
'촬영 영상에서 몸의 관절을 충분히 인식하지 못했습니다. 전신이 보이도록 다시 촬영해 주세요.'
);

tipEl.textContent=
'머리부터 발까지 화면 안에 들어오도록 조금 더 멀리 서서 다시 촬영해 보세요.';

return;

}


renderResult(data);

}


function renderResult(data){

const minK=
Math.min(
...data.map(x=>x.knee)
);


const maxEl=
Math.max(
...data.map(x=>x.elbow)
);


const first=
data[0];

const last=
data[data.length-1];


const minIndex=
data.reduce(
(best,x,i)=>
x.knee<data[best].knee
?i
:best,
0
);


const peak=
data[minIndex];


const kneeOK=
mode==='shoot'
?
minK>=100 &&
minK<=150
:
minK>=110 &&
minK<=155;


const elbowOK=
maxEl<155;


const bend=
peak.knee-
first.knee;


const elbowRise=
last.elbow-
peak.elbow;


const syncOK=
bend<45 &&
bend>8 &&
elbowRise>3;


let score=
(kneeOK?34:0)+
(elbowOK?33:0)+
(syncOK?33:0);


scoreEl.textContent=
score;


badge(
kneeEl,
kneeOK
?'좋아요'
:'무릎 굽힘을 조절해 보세요',
kneeOK
?'ok'
:'no'
);


badge(
elbowEl,
elbowOK
?'좋아요'
:'팔꿈치가 많이 벌어졌어요',
elbowOK
?'ok'
:'no'
);


badge(
syncEl,
syncOK
?'함께 펴지는 동작이에요'
:'무릎과 팔 동작을 함께 연결해 보세요',
syncOK
?'ok'
:'no'
);


if(score===100){

tipEl.textContent=
'좋아요! 전체 슛 동작의 세 가지 기준을 모두 만족했어요.';

}

else if(!kneeOK){

tipEl.textContent=
'슛할 때 무릎을 충분히 굽혔다가 펴는 흐름을 만들어 보세요.';

}

else if(!elbowOK){

tipEl.textContent=
'팔꿈치가 몸 옆으로 과하게 벌어지지 않도록 해 보세요.';

}

else{

tipEl.textContent=
'무릎이 펴지는 순간 팔꿈치도 함께 펴지는 흐름을 만들어 보세요.';

}


resultsEl.innerHTML=

`<div class="result">
가장 많이 굽힌 무릎 각도:
<b>${Math.round(minK)}°</b>
</div>

<div class="result">
팔꿈치 최대 각도:
<b>${Math.round(maxEl)}°</b>
</div>

<div class="result">
분석한 영상 길이:
<b>${fmt(video.duration)}</b>
</div>`;


status(
'분석 완료! 아래 재생 막대를 움직여 동작을 다시 확인할 수 있습니다.'
);

}


shootTab.onclick=()=>{

mode='shoot';

shootTab.classList.add('active');

passTab.classList.remove('active');

resetResult();

status(
'슛 자세 모드입니다.'
);

};


passTab.onclick=()=>{

mode='pass';

passTab.classList.add('active');

shootTab.classList.remove('active');

resetResult();

status(
'패스 자세 모드입니다.'
);

};


startBtn.onclick=
beginRecording;

stopBtn.onclick=
stopRecording;

</script>

</body>
</html>
